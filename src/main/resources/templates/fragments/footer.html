<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="practiceFooter" class="assignment-footer">
    <style>
        .assignment-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1030;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            color: #343a40;
            font-size: 0.875rem;
            padding: 0.6rem 1rem;
            text-align: center;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
        }

        body {
            padding-bottom: 56px;
        }
    </style>
    <span>실습 수행 일시: </span>
    <span id="practiceDateTime"
          th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}">2026-06-04 00:00:00</span>
    <span> | 학번: 2271435 | 성명: 최서영</span>
    <script>
        (function () {
            const target = document.getElementById('practiceDateTime');
            if (!target) return;

            function pad(value) {
                return String(value).padStart(2, '0');
            }

            function renderNow() {
                const now = new Date();
                target.textContent = now.getFullYear() + '-' +
                    pad(now.getMonth() + 1) + '-' +
                    pad(now.getDate()) + ' ' +
                    pad(now.getHours()) + ':' +
                    pad(now.getMinutes()) + ':' +
                    pad(now.getSeconds());
            }

            renderNow();
            setInterval(renderNow, 1000);
        })();
    </script>
</footer>
</body>
</html>
